services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - node-backend
    restart: unless-stopped

  backend:
    build:
      context: ./node_backend
      dockerfile: Dockerfile
    image: node-backend:latest
    container_name: node-backend
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: your_super_secret_key
      NODE_ENV: production
      DB_URL: postgres://postgres:mysecretpass@postgres:5432/postgres
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: mysecretpass
      DB_NAME: postgres
      FLASK_API_BASE: http://server:5000
      FRONTEND_URL: http://localhost:5173
    restart: always
