services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ./flask_backend
      dockerfile: Dockerfile
    image: flask-server:latest
    container_name: flask-server
    restart: always
    command: sh -c "python load_problems/load_problems.py && python workers/server.py"
    working_dir: /app
    environment:
      PYTHONPATH: /app
    volumes:
      - submissions:/app/submissions
      - /var/run/docker.sock:/var/run/docker.sock

  worker:
    build:
      context: ./flask_backend
      dockerfile: Dockerfile
    image: flask-worker:latest
    container_name: flask-worker
    restart: always
    command: >
      celery -A workers.tasks worker
            --loglevel=${LOG_LEVEL:-DEBUG}
            --concurrency=3
            --queues=submitQueue,runQueue,runSystemQueue
    depends_on:
      - redis
    environment:
      REDIS_BROKER_URL: redis://redis:6379/0
      REDIS_BACKEND_URL: redis://redis:6379/0
      BACKEND_URL: https://ctdoj.credenz.co.in
      PYTHONPATH : /app
    working_dir: /app/submissions
    volumes:
      - submissions:/app/submissions
      - /var/run/docker.sock:/var/run/docker.sock

  redis:
    image: redis:latest
    container_name: my-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
volumes:
  redisdata:
  submissions:
    name: submissions