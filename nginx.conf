server {
    listen 80;
    server_name mainweb.credenz.co.in;
    return 301 https://$host$request_uri;  # redirect all HTTP to HTTPS
}

server {
    listen 443 ssl;
    server_name mainweb.credenz.co.in;

    ssl_certificate /etc/letsencrypt/live/mainweb.credenz.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mainweb.credenz.co.in/privkey.pem;


    # Normal HTTP Proxying (e.g., REST API, Webhooks)
    location / {
        proxy_pass http://flask-server:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}